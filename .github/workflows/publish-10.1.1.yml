name: Publish 10.1.1 Direct Files

on:
  push:
    paths:
      - '.github/workflows/publish-10.1.1.yml'
      - 'tools/publish_10_1_1.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build direct files
        run: python tools/publish_10_1_1.py
      - name: Validate
        shell: pwsh
        run: |
          $m = Get-Content channel.json -Raw | ConvertFrom-Json
          if ($m.version -ne '10.1.1') { throw 'Channel version mismatch' }
          if ($m.files.Count -ne 2) { throw 'Expected 2 direct files' }
          if (-not (Test-Path direct/10.1.1/app/main.py)) { throw 'main.py missing' }
          if (-not (Test-Path direct/10.1.1/app/static/app.js)) { throw 'app.js missing' }
      - name: Publish atomically
        shell: bash
        run: |
          git config user.name "Topaloglu Update Bot"
          git config user.email "actions@users.noreply.github.com"
          git add direct/10.1.1/app/main.py direct/10.1.1/app/static/app.js channel.json
          git diff --cached --quiet && exit 0
          git commit -m "Publish direct update 10.1.1"
          git push
