name: Publish 10.1.5 Direct Files
on:
  push:
    paths:
      - 'tools/publish_10_1_5.py'
      - '.github/workflows/publish-10.1.5.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and validate
        run: |
          python tools/publish_10_1_5.py
          python -m py_compile tools/publish_10_1_5.py
          test -s direct/10.1.5/app/static/app.js
          test -s direct/10.1.5/app/static/style.css
          grep -q 'Fiyatlar tutmuyor' direct/10.1.5/app/static/app.js
          grep -q 'Fiyatların doğruluğu sorumluluk altında değildir' direct/10.1.5/app/static/app.js
      - name: Publish
        run: |
          git config user.name 'topaloglu-update-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add direct/10.1.5 channel.json
          git commit -m 'Publish 10.1.5 critical-only wallboard' || exit 0
          git push
