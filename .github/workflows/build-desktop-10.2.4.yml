name: Build Desktop 10.2.4

on:
  push:
    paths:
      - 'tools/patch_desktop_10_2_4.py'
      - '.github/workflows/build-desktop-10.2.4.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare desktop source
        shell: pwsh
        run: |
          python tools/build_desktop_10_2_0.py
          python tools/patch_desktop_runtime_10_2_0.py
          python tools/patch_desktop_10_2_1.py
          python tools/patch_desktop_10_2_3.py
          python tools/patch_desktop_10_2_4.py
          $app = Get-ChildItem _desktop_src -Directory | Where-Object { Test-Path (Join-Path $_.FullName 'app') } | Select-Object -First 1
          if (-not $app) { throw 'App root not found' }
          "APPDIR=$($app.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r "$env:APPDIR\requirements.txt"
          pip install -r "$env:APPDIR\desktop_requirements.txt"

      - name: Validate source and premium UI
        shell: pwsh
        run: |
          python -m py_compile "$env:APPDIR\desktop_launcher.py" "$env:APPDIR\app\main.py"
          $idx=Get-Content "$env:APPDIR\app\static\index.html" -Raw
          $boot=Get-Content "$env:APPDIR\app\static\mete_boot.js" -Raw
          $css=Get-Content "$env:APPDIR\app\static\style.css" -Raw
          if ($idx -notmatch 'v10.2.4') { throw 'Desktop version 10.2.4 missing' }
          if ($idx -notmatch 'id="meteBoot"') { throw 'METE boot overlay missing' }
          if ($idx -notmatch 'mete_boot.js') { throw 'METE boot script tag missing' }
          if ($boot -notmatch 'marketplace guard') { throw 'METE boot JS invalid' }
          if ($css -notmatch 'premium desktop refresh') { throw 'Premium UI CSS missing' }
          if ($idx -notmatch 'Ayarlar & Bağlantılar') { throw 'Settings UI regressed' }

      - name: Build desktop executable
        shell: pwsh
        working-directory: ${{ env.APPDIR }}
        run: |
          pyinstaller --noconfirm --clean --windowed `
            --name "Topaloglu Pazaryeri Merkezi" `
            --collect-all webview `
            --collect-submodules app `
            --hidden-import uvicorn.logging `
            --hidden-import uvicorn.loops.auto `
            --hidden-import uvicorn.protocols.http.auto `
            --hidden-import uvicorn.protocols.websockets.auto `
            --hidden-import uvicorn.lifespan.on `
            --add-data "app/static;app/static" `
            desktop_launcher.py

      - name: Verify packaged static files
        shell: pwsh
        run: |
          $dist=Join-Path $env:APPDIR 'dist\Topaloglu Pazaryeri Merkezi\_internal\app\static'
          if (-not (Test-Path (Join-Path $dist 'mete_boot.js'))) { throw 'mete_boot.js missing from EXE package' }
          if (-not (Test-Path (Join-Path $dist 'desktop_settings.js'))) { throw 'desktop_settings.js missing from EXE package' }
          $idx=Get-Content (Join-Path $dist 'index.html') -Raw
          if ($idx -notmatch 'v10.2.4') { throw 'Packaged index has wrong version' }
          if ($idx -notmatch 'id="meteBoot"') { throw 'Packaged METE boot UI missing' }
          $boot=Get-Content (Join-Path $dist 'mete_boot.js') -Raw
          if ($boot -notmatch 'critical-only wallboard') { throw 'Packaged boot script invalid' }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) { choco install innosetup -y --no-progress }

      - name: Build installer
        shell: pwsh
        working-directory: ${{ env.APPDIR }}
        run: |
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' desktop_installer.iss
          $installer=Join-Path $env:APPDIR 'installer\Topaloglu-Pazaryeri-Merkezi-Setup-10.2.4.exe'
          if (-not (Test-Path $installer)) { throw 'Installer not produced' }
          $hash=(Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
          "INSTALLER=$installer" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "INSTALLER_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v10.2.4 --repo $env:GITHUB_REPOSITORY --yes 2>$null; if ($LASTEXITCODE -ne 0) { $global:LASTEXITCODE=0 }
          git push origin :refs/tags/v10.2.4 2>$null; if ($LASTEXITCODE -ne 0) { $global:LASTEXITCODE=0 }
          gh release create v10.2.4 "$env:INSTALLER" --repo $env:GITHUB_REPOSITORY --title 'Topaloğlu Pazaryeri Merkezi 10.2.4' --notes 'Premium masaüstü arayüz yenilemesi ve uygulama açılışında terminal/CMD tarzı METE boot animasyonu eklendi.'

      - name: Publish desktop channel
        shell: pwsh
        run: |
          $obj=[ordered]@{version='10.2.4';published_at=(Get-Date -Format 'yyyy-MM-dd');installer_url='https://github.com/topaloglusarraf-afk/topaloglu-updates/releases/download/v10.2.4/Topaloglu-Pazaryeri-Merkezi-Setup-10.2.4.exe';sha256=$env:INSTALLER_SHA256;notes='Premium arayüz yenilendi; terminal/CMD tarzı METE açılış animasyonu eklendi.'}
          $obj | ConvertTo-Json | Set-Content desktop-channel.json -Encoding utf8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add desktop-channel.json
          git commit -m 'Publish desktop 10.2.4 channel' || echo 'No changes'
          git push

      - uses: actions/upload-artifact@v4
        with:
          name: Topaloglu-Pazaryeri-Merkezi-Setup-10.2.4
          path: ${{ env.INSTALLER }}
