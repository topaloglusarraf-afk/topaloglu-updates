name: Publish 10.0.7

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build update package
        run: python tools/publish_10_0_7.py
      - name: Commit published update
        shell: bash
        run: |
          git config user.name "Topaloglu Update Bot"
          git config user.email "actions@users.noreply.github.com"
          git add update-10.0.7.zip latest.json
          git diff --cached --quiet && exit 0
          git commit -m "Publish update 10.0.7"
          git push
