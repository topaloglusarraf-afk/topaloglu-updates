name: Verify 10.1.2 Raw Hashes

on:
  push:
    paths:
      - '.github/workflows/verify-10.1.2.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify published raw bytes
        run: |
          python - <<'PY'
          import hashlib,json,urllib.request
          m=json.load(open('channel.json',encoding='utf-8'))
          assert m['version']=='10.1.2',m['version']
          for f in m['files']:
              data=urllib.request.urlopen(f['url']+'?verify=1012').read()
              got=hashlib.sha256(data).hexdigest()
              print(f['path'],got)
              assert got==f['sha256'],(f['path'],got,f['sha256'])
          print('ALL RAW HASHES OK')
          PY
