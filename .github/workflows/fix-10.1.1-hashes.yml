name: Fix 10.1.1 Raw Hashes
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-10.1.1-hashes.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recalculate hashes from exact raw bytes
        run: |
          python - <<'PY'
          import hashlib, json, urllib.request
          from pathlib import Path
          base='https://raw.githubusercontent.com/topaloglusarraf-afk/topaloglu-updates/main/'
          files=[]
          for rel in ['app/main.py','app/static/app.js']:
              url=base+'direct/10.1.1/'+rel
              with urllib.request.urlopen(url) as r:
                  data=r.read()
              files.append({'path':rel,'url':url,'sha256':hashlib.sha256(data).hexdigest()})
          channel={
            'version':'10.1.1',
            'published_at':'2026-08-14',
            'notes':'Kritik kayıtları sıfırlama, ortak ekran yenileme ve kontrol dışı pazaryeri kayıtlarını temizleme.',
            'files':files
          }
          Path('channel.json').write_text(json.dumps(channel,ensure_ascii=False,indent=2)+'\n',encoding='utf-8',newline='\n')
          print(json.dumps(channel,ensure_ascii=False,indent=2))
          PY
      - name: Commit corrected hashes
        run: |
          git config user.name "Topaloglu Update Bot"
          git config user.email "actions@users.noreply.github.com"
          git add channel.json
          git diff --cached --quiet && exit 0
          git commit -m "Fix 10.1.1 raw SHA256 hashes"
          git push
