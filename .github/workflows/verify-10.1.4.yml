name: Verify 10.1.4 Raw Hashes
on:
  push:
    paths:
      - '.github/workflows/verify-10.1.4.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify published raw bytes
        run: |
          python - <<'PY'
          import json,hashlib,urllib.request
          c=json.load(open('channel.json',encoding='utf-8'))
          assert c['version']=='10.1.4', c['version']
          for f in c['files']:
              data=urllib.request.urlopen(f['url']+'?v=1014').read()
              got=hashlib.sha256(data).hexdigest()
              assert got==f['sha256'], (f['path'],got,f['sha256'])
          print('10.1.4 raw hashes verified')
          PY
